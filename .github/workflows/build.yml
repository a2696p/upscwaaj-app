name: Build Premium UPSCwaaj App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project & Build Artifacts
        run: |
          mkdir -p app/src/main/java/com/upscwaaj/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > settings.gradle
          rootProject.name = "UPSCwaaj"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=34
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.upscwaaj.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.upscwaaj.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="UPSCwaaj"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0f172a</item>
                  <item name="android:windowBackground">#0f172a</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0f172a">
              
              <!-- Main Content (Website) -->
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipe_refresh"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">
                  <WebView
                      android:id="@+id/webview"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent" />
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
              
              <!-- Premium Splash Screen Overlay -->
              <RelativeLayout
                  android:id="@+id/splash_screen"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#0f172a"
                  android:elevation="10dp">
                  
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_centerInParent="true"
                      android:gravity="center"
                      android:orientation="vertical">
                      
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="UPSCwaaj"
                          android:textColor="#eab308"
                          android:textSize="44sp"
                          android:textStyle="bold"
                          android:fontFamily="sans-serif-black"
                          android:letterSpacing="0.02" />
                          
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="WORLD AFFAIRS"
                          android:textColor="#94a3b8"
                          android:textSize="13sp"
                          android:textStyle="bold"
                          android:letterSpacing="0.3"
                          android:layout_marginTop="6dp" />
                  </LinearLayout>
              </RelativeLayout>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/upscwaaj/app/MainActivity.java
          package com.upscwaaj.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          import android.animation.ObjectAnimator;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.ContextCompat;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private SwipeRefreshLayout swipeRefreshLayout;
              private View splashScreen;
              private boolean isSplashGone = false;

              private final ActivityResultLauncher<String> requestPermissionLauncher =
                  registerForActivityResult(new ActivityResultContracts.RequestPermission(), isGranted -> {});

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  swipeRefreshLayout = findViewById(R.id.swipe_refresh);
                  splashScreen = findViewById(R.id.splash_screen);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          swipeRefreshLayout.setRefreshing(false);
                          
                          // Trigger smooth fade out ONLY when website is loaded
                          if (!isSplashGone) {
                              isSplashGone = true;
                              ObjectAnimator fadeOut = ObjectAnimator.ofFloat(splashScreen, "alpha", 1f, 0f);
                              fadeOut.setDuration(800);
                              fadeOut.start();
                              splashScreen.postDelayed(() -> splashScreen.setVisibility(View.GONE), 800);
                          }
                      }
                  });

                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl("https://www.upscwaaj.com");

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) !=
                              PackageManager.PERMISSION_GRANTED) {
                          requestPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH

          gradle wrapper --gradle-version 8.2
          ./gradlew bundleRelease assembleDebug --no-daemon

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: UPSCwaaj-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: UPSCwaaj-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
