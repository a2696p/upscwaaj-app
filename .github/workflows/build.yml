name: Build Premium UPSCWAAJ App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project & Build Artifacts
        run: |
          mkdir -p app/src/main/java/com/upscwaaj/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # --- SMART ICON COMPILER ---
          # 1. Safely rename any files with dashes to underscores to prevent Android errors
          for img in *.png; do
            if [ -f "$img" ]; then
              safe_name=$(echo "$img" | tr '-' '_')
              if [ "$img" != "$safe_name" ]; then
                mv "$img" "$safe_name"
              fi
            fi
          done

          # 2. Copy all safe PNGs into the Android mipmap folder
          for img in *.png; do
            if [ -f "$img" ]; then
              cp "$img" "app/src/main/res/mipmap-xxxhdpi/$img"
            fi
          done
          
          # 3. Assign the App Icons safely
          cd app/src/main/res/mipmap-xxxhdpi
          
          MAIN_ICON=$(ls playstore_icon.png ic_launcher_web.png apple_touch_icon.png upscwaaj_logo.png 2>/dev/null | head -n 1 || true)
          [ -z "$MAIN_ICON" ] && MAIN_ICON=$(ls *.png 2>/dev/null | head -n 1 || true)
          
          # Fallback if no custom icon was uploaded
          if [ -z "$MAIN_ICON" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > fallback_icon.png
            MAIN_ICON="fallback_icon.png"
          fi
          
          if [ -n "$MAIN_ICON" ] && [ "$MAIN_ICON" != "ic_launcher.png" ]; then
            cp "$MAIN_ICON" ic_launcher.png
          fi
          if [ -n "$MAIN_ICON" ] && [ "$MAIN_ICON" != "ic_launcher_round.png" ]; then
            cp "$MAIN_ICON" ic_launcher_round.png
          fi
          
          NOTIFY_ICON=$(ls *notification*.png *transparent*.png 2>/dev/null | head -n 1 || true)
          if [ -n "$NOTIFY_ICON" ] && [ "$NOTIFY_ICON" != "ic_notification_final.png" ]; then
            cp "$NOTIFY_ICON" ic_notification_final.png
          elif [ -n "$MAIN_ICON" ] && [ "$MAIN_ICON" != "ic_notification_final.png" ]; then
            cp "$MAIN_ICON" ic_notification_final.png
          fi
          
          cd ../../../../..

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="accentColor">#eab308</color>
          </resources>
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "UPSCWAAJ"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=34
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'com.google.gms.google-services'
          android {
              namespace 'com.upscwaaj.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.upscwaaj.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 12
                  versionName "1.11"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-messaging'
          }
          EOF
          
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "568036902049",
              "project_id": "upscwaaj-7972c",
              "storage_bucket": "upscwaaj-7972c.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:568036902049:android:0b33bf252399bbbbfc9ce0",
                  "android_client_info": {
                    "package_name": "com.upscwaaj.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDKBrTGygiaXEPoX0XW23fhg8VZDs3Y81M"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="UPSCWAAJ"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="www.upscwaaj.com" />
                          <data android:scheme="https" android:host="upscwaaj.com" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MyFirebaseMessagingService"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
                  
                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_icon"
                      android:resource="@mipmap/ic_notification_final" />
                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_color"
                      android:resource="@color/accentColor" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#eab308</item>
                  <item name="android:windowBackground">#0f172a</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0f172a">
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipe_refresh"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">
                  <WebView
                      android:id="@+id/webview"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent" />
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
              <LinearLayout
                  android:id="@+id/offline_layout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:visibility="gone"
                  android:background="#0f172a">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="No Internet Connection"
                      android:textColor="#eab308"
                      android:textSize="22sp"
                      android:textStyle="bold" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Please check your network and try again."
                      android:textColor="#94a3b8"
                      android:textSize="14sp"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="24dp" />
                  <Button
                      android:id="@+id/btn_retry"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Retry"
                      android:backgroundTint="#eab308"
                      android:textColor="#0f172a" />
              </LinearLayout>
              <RelativeLayout
                  android:id="@+id/splash_screen"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#eab308"
                  android:elevation="10dp">
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_centerInParent="true"
                      android:gravity="center"
                      android:orientation="vertical">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="UPSCWAAJ"
                          android:textColor="#0f172a"
                          android:textSize="44sp"
                          android:textStyle="bold"
                          android:fontFamily="sans-serif-black" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="WORLD AFFAIRS"
                          android:textColor="#0f172a"
                          android:textSize="13sp"
                          android:textStyle="bold"
                          android:layout_marginTop="6dp" />
                  </LinearLayout>
              </RelativeLayout>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/upscwaaj/app/MyFirebaseMessagingService.java
          package com.upscwaaj.app;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class MyFirebaseMessagingService extends FirebaseMessagingService {
              @Override
              public void onMessageReceived(RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);
              }
              @Override
              public void onNewToken(String token) {
                  super.onNewToken(token);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/upscwaaj/app/MainActivity.java
          package com.upscwaaj.app;
          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          import android.widget.Button;
          import android.animation.ObjectAnimator;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.ContextCompat;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private SwipeRefreshLayout swipeRefreshLayout;
              private View splashScreen;
              private View offlineLayout;
              private Button btnRetry;
              private boolean isSplashGone = false;

              private final ActivityResultLauncher<String> requestPermissionLauncher =
                  registerForActivityResult(new ActivityResultContracts.RequestPermission(), isGranted -> {});

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  swipeRefreshLayout = findViewById(R.id.swipe_refresh);
                  splashScreen = findViewById(R.id.splash_screen);
                  offlineLayout = findViewById(R.id.offline_layout);
                  btnRetry = findViewById(R.id.btn_retry);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  btnRetry.setOnClickListener(v -> loadWebsite());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.contains("api.whatsapp.com") || url.contains("t.me") || url.contains("twitter.com") || url.contains("facebook.com/sharer")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  return false;
                              }
                          }
                          return false;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              swipeRefreshLayout.setVisibility(View.GONE);
                              offlineLayout.setVisibility(View.VISIBLE);
                              if (!isSplashGone) hideSplash();
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          swipeRefreshLayout.setRefreshing(false);
                          if (!isSplashGone) hideSplash();
                      }
                  });

                  swipeRefreshLayout.setOnRefreshListener(this::loadWebsite);
                  loadWebsite();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }
              }

              private void hideSplash() {
                  isSplashGone = true;
                  ObjectAnimator fadeOut = ObjectAnimator.ofFloat(splashScreen, "alpha", 1f, 0f);
                  fadeOut.setDuration(800);
                  fadeOut.start();
                  splashScreen.postDelayed(() -> splashScreen.setVisibility(View.GONE), 800);
              }

              private void loadWebsite() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  NetworkInfo activeNetwork = cm.getActiveNetworkInfo();
                  if (activeNetwork != null && activeNetwork.isConnectedOrConnecting()) {
                      offlineLayout.setVisibility(View.GONE);
                      swipeRefreshLayout.setVisibility(View.VISIBLE);
                      webView.loadUrl("https://www.upscwaaj.com");
                  } else {
                      swipeRefreshLayout.setRefreshing(false);
                      swipeRefreshLayout.setVisibility(View.GONE);
                      offlineLayout.setVisibility(View.VISIBLE);
                      if (!isSplashGone) hideSplash();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack() && offlineLayout.getVisibility() == View.GONE) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH

          gradle wrapper --gradle-version 8.2
          ./gradlew bundleRelease assembleDebug --no-daemon

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: UPSCWAAJ-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: UPSCWAAJ-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
