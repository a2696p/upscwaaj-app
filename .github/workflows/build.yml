name: Build UPSCwaaj AAB and APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project & Build Artifacts
        run: |
          mkdir -p app/src/main/java/com/upscwaaj/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > settings.gradle
          rootProject.name = "UPSCwaaj"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.upscwaaj.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.upscwaaj.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.core:core-splashscreen:1.0.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="UPSCwaaj"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.App.Starting">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.App.Starting" parent="Theme.SplashScreen">
                  <!-- Vibrant UPSCwaaj Yellow splash screen background -->
                  <item name="windowSplashScreenBackground">#f59e0b</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
                  <item name="windowSplashScreenAnimationDuration">1000</item>
                  <item name="postSplashScreenTheme">@style/AppTheme</item>
              </style>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0c1424</item>
              </style>
          </resources>
          EOF

          # Splash icon styled with deep dark contrast elements to look striking on yellow
          cat << 'EOF' > app/src/main/res/drawable/splash_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#0c1424"
                android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,20c-4.41,0 -8,-3.59 -8,-8s3.59,-8 8,-8 8,3.59 8,8 -3.59,8 -8,8z"/>
            <path
                android:fillColor="#ffffff"
                android:pathData="M12,6l-6,6h4v6h4v-6h4z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/java/com/upscwaaj/app/MainActivity.java
          package com.upscwaaj.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.ContextCompat;
          import androidx.core.splashscreen.SplashScreen;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private SwipeRefreshLayout swipeRefreshLayout;

              private final ActivityResultLauncher<String> requestPermissionLauncher =
                  registerForActivityResult(new ActivityResultContracts.RequestPermission(), isGranted -> {});

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  SplashScreen splashScreen = SplashScreen.installSplashScreen(this);
                  super.onCreate(savedInstanceState);

                  swipeRefreshLayout = new SwipeRefreshLayout(this);
                  webView = new WebView(this);
                  swipeRefreshLayout.addView(webView);
                  setContentView(swipeRefreshLayout);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setDatabaseEnabled(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          swipeRefreshLayout.setRefreshing(false);
                      }
                  });

                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());

                  webView.loadUrl("https://www.upscwaaj.com");

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) !=
                              PackageManager.PERMISSION_GRANTED) {
                          requestPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH

          gradle wrapper --gradle-version 8.2
          ./gradlew bundleRelease assembleDebug --no-daemon

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: UPSCwaaj-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: UPSCwaaj-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
